name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    if: github.repository == 'ErykMikolajewicz/prawobiorca-backend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check
      - run: uv run poe test

  frontend:
    if: github.repository == 'ErykMikolajewicz/prawobiorca-backend'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prawobiorca-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: prawobiorca-frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: prawobiorca-frontend/package.json
          cache: pnpm
          cache-dependency-path: prawobiorca-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
