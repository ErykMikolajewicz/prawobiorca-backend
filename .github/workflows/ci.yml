name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    if: github.repository == 'ErykMikolajewicz/prawobiorca-backend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check
      - run: cp core-service/.env.example core-service/.env
      - run: uv run poe test

  integration:
    if: github.repository == 'ErykMikolajewicz/prawobiorca-backend'
    runs-on: ubuntu-latest
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: cp core-service/.env.example core-service/.env
      - run: uv run poe test_integration

  frontend:
    if: github.repository == 'ErykMikolajewicz/prawobiorca-backend'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prawobiorca-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: prawobiorca-frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: prawobiorca-frontend/package.json
          cache: pnpm
          cache-dependency-path: prawobiorca-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
