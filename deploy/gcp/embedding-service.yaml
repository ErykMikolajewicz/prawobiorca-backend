apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prawobiorca
      component: embedding-service
  template:
    metadata:
      labels:
        app: prawobiorca
        component: embedding-service
    spec:
      initContainers:
        - name: embedding-model-export
          image: docker.io/library/python:3.12-slim
          command:
            - sh
            - -c
            - |
              set -e
              MODEL_DIR=/models/mmlw-retrieval-roberta-large-v2
              [ -f "$MODEL_DIR/openvino_model.xml" ] && exit 0
              pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu torch "optimum-intel[openvino]==2.2.*" "openvino==2026.3.*" "openvino-tokenizers[transformers]==2026.3.*" sentence-transformers
              optimum-cli export openvino --model sdadas/mmlw-retrieval-roberta-large-v2 --disable-convert-tokenizer --task feature-extraction --weight-format int8 "$MODEL_DIR.tmp"
              convert_tokenizer -o "$MODEL_DIR.tmp" sdadas/mmlw-retrieval-roberta-large-v2
              mv "$MODEL_DIR.tmp" "$MODEL_DIR"
          volumeMounts:
            - name: embedding-model
              mountPath: /models
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
              ephemeral-storage: "8Gi"
            limits:
              cpu: "2"
              memory: "6Gi"
              ephemeral-storage: "8Gi"
      containers:
        - name: embedding-service
          image: docker.io/openvino/model_server:2026.3
          args:
            - --model_path=/models/mmlw-retrieval-roberta-large-v2
            - --model_name=mmlw-retrieval-roberta-large-v2
            - --task=embeddings
            - --pooling=CLS
            - --target_device=CPU
            - --rest_port=8080
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: embedding-model
              mountPath: /models
          resources:
            requests:
              cpu: "500m"
              memory: "1.5Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          startupProbe:
            httpGet:
              path: /v2/health/live
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: 8080
            periodSeconds: 20
      volumes:
        - name: embedding-model
          persistentVolumeClaim:
            claimName: embedding-model

---
apiVersion: v1
kind: Service
metadata:
  name: embedding-service
spec:
  selector:
    app: prawobiorca
    component: embedding-service
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: embedding-model
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
