apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prawobiorca
      component: llm-service
  template:
    metadata:
      labels:
        app: prawobiorca
        component: llm-service
    spec:
      containers:
        - name: llm-service
          image: docker.io/openvino/model_server:2026.3
          args:
            - --source_model=OpenVINO/gemma-4-E4B-it-int8-ov
            - --model_name=gemma-4-e4b-it
            - --model_repository_path=/models
            - --task=text_generation
            - --pipeline_type=VLM
            - --target_device=CPU
            - --rest_port=8080
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: llm-model
              mountPath: /models
          resources:
            requests:
              cpu: "2"
              memory: "10Gi"
            limits:
              cpu: "4"
              memory: "14Gi"
          startupProbe:
            httpGet:
              path: /v2/health/live
              port: 8080
            periodSeconds: 30
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: 8080
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: 8080
            periodSeconds: 20
            failureThreshold: 6
      volumes:
        - name: llm-model
          persistentVolumeClaim:
            claimName: llm-model

---
apiVersion: v1
kind: Service
metadata:
  name: llm-service
spec:
  selector:
    app: prawobiorca
    component: llm-service
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: llm-service
spec:
  hosts:
    - llm-service.default.svc.cluster.local
  scaleTargetRef:
    name: llm-service
    kind: Deployment
    apiVersion: apps/v1
    service: llm-service
    port: 8080
  replicas:
    min: 0
    max: 1

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-model
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
