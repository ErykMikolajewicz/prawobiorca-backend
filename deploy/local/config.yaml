apiVersion: v1
kind: ConfigMap
metadata:
  name: prawobiorca-backend-config
data:
  APP_LOGGING_LEVEL: "INFO"
  APP_COOKIE_SECURE: "false"

  RELATIONAL_DB_USER: "postgres"
  RELATIONAL_DB_HOST: "postgres"
  RELATIONAL_DB_PORT: "5432"
  RELATIONAL_DB_NAME: "postgres"

  EMBEDDING_SERVICE_URL: "http://embedding-service:8080"
  EXTRACTION_SERVICE_URL: "http://extraction-service:8080"

  OBJECT_STORAGE_ENDPOINT_URL: "http://rustfs:9000"
  # Used only to sign urls handed to the browser, which can not resolve the in-cluster hostname.
  OBJECT_STORAGE_PUBLIC_ENDPOINT_URL: "http://localhost:9000"
  OBJECT_STORAGE_REGION: "us-east-1"
  OBJECT_STORAGE_BUCKET: "regulations"

  BROKER_URL: "redis://redis:6379"
