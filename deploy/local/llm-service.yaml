apiVersion: v1
kind: Pod
metadata:
  name: llm-service
  labels:
    app: prawobiorca
    component: llm-service
spec:
  containers:
    - name: llm-service
      image: docker.io/openvino/model_server:2026.3-gpu
      args:
        - --source_model=OpenVINO/gemma-4-E4B-it-int8-ov
        - --model_name=gemma-4-e4b-it
        - --model_repository_path=/models
        - --task=text_generation
        - --pipeline_type=VLM
        - --target_device=AUTO
        - --rest_port=8080
      securityContext:
        privileged: true
      ports:
        - containerPort: 8080
          hostPort: 8083
      volumeMounts:
        - name: llm-model
          mountPath: /models
        - name: dri
          mountPath: /dev/dri
  volumes:
    - name: llm-model
      persistentVolumeClaim:
        claimName: llm-model
    - name: dri
      hostPath:
        path: /dev/dri
