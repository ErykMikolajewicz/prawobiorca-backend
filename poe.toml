[tasks]
dev = "uv run cicd/scripts/dev.py"
run_locally = "uv run cicd/scripts/run_locally.py"
run_locally_down = "uv run cicd/scripts/stop_locally.py"
test_integration = "uv run --group test pytest tests/integration"
test = "uv run --group test pytest tests/unit"
build_app = "podman image build --tag=prawobiorca-backend ."
build_embedding-service = "podman image build --tag=embedding-service embedding-service"
build_extraction-service = "podman image build --tag=extraction-service extraction-service"
upgrade_db_schemas = "uv run --group test alembic upgrade head"
seed = "uv run cicd/init/seed_relational_db.py"
init_regulations = "uv run cicd/init/init_regulations.py"
run_worker = "uv run taskiq worker app.framework.workers.regulations:broker"

[tasks.cov]
sequence = [
    { cmd = "uv run coverage erase" },
    { cmd = "uv run pytest tests/unit --cov=app" },
    { cmd = "uv run coverage report -m --skip-covered --fail-under=95 --sort=Cover" }
]

[tasks.build_images]
sequence = ["build_app", "build_embedding-service", "build_extraction-service"]

[tasks.init_db]
sequence = ["upgrade_db_schemas", "seed", "init_regulations"]
