[project]
name = "prawobiorca-backend"
version = "0.49.9"
description = "Law acts search engine with AI features."
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "asyncpg==0.31.*",
    "bcrypt==5.0.*",
    "email-validator==2.3.*",
    "fastapi==0.141.*",
    "granian==2.7.*",
    "httpx2==2.9.*",
    "pgvector==0.5.*",
    "pydantic==2.13.*",
    "pydantic-settings==2.14.*",
    "python-multipart==0.0.32",
    "sqlalchemy[asyncio]==2.0.*",
]

[dependency-groups]
dev = [
    "granian[reload]==2.7.*",
    "poethepoet==0.48.*",
    "ruff==0.15.*",
]
docs = [
    "mkdocstrings[python]==1.0.*",
    "zensical==0.0.51",
]
google-cloud = [
    "google-cloud-storage==3.13.*",
]
local-storage = [
    "aiofiles==25.1.*",
]

test = [
    "alembic==1.18.*",
    "pytest==9.1.*",
    "pytest-asyncio==1.4.*",
    "pytest-cov==7.1.*",
    "testcontainers[postgres]==4.14.*",
]

[tool.poe.tasks]
run_locally = "uv run cicd/scripts/run_locally.py"

test_integration = "uv run --group test pytest tests/integration"

build_app = "podman image build --tag=prawobiorca-backend ."
build_text-transformator = "podman image build --tag=text-transformator text-transformator"

upgrade_db_schemas = "uv run --group test alembic upgrade head"
seed = "uv run cicd/init/seed_relational_db.py"
init_regulations = "uv run cicd/init/init_regulations.py"
cov = "coverage report -m --skip-covered --fail-under=95 --sort=Cover"

[tool.poe.tasks.build_images]
sequence = ["build_app", "build_text-transformator"]

[tool.poe.tasks.init_db]
sequence = ["upgrade_db_schemas", "seed", "init_regulations"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
addopts = '-m "not slow"'
markers = [
    "slow: marks tests as slow",
]

[tool.coverage.report]
omit = [
    "app/framework/**",
    "app/infrastructure/relational_db/**"
]

[tool.ruff]
line-length = 120
target-version = "py314"

exclude = [
    "alembic",
]

[tool.ruff.lint]
select = ["S", "I", "E", "F", "B"]
ignore = ["B904", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scripts/*" = ["S"]
"cicd/*" = ["S"]
