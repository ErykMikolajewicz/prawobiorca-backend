[project]
name = "prawobiorca-backend"
version = "0.26.0"
description = "Law acts search engine with AI features."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg==0.31.*",
    "bcrypt==5.0.*",
    "email-validator==2.3.*",
    "fastapi==0.135.*",
    "granian==2.7.*",
    "httpx==0.28.*",
    "itsdangerous==2.2.*",
    "jinja2==3.1.*",
    "pydantic-settings==2.13.*",
    "python-multipart==0.0.22",
    "qdrant-client==1.17.*",
    "sqlalchemy[asyncio]==2.0.*",
]

[dependency-groups]
dev = [
    "granian[reload]==2.7.*",
    "ruff==0.15.*",
]
docs = [
    "mkdocstrings[python]==1.0.*",
    "zensical==0.0.29",
]
google-cloud = [
    "google-cloud-storage==3.10.*",
]
local-storage = [
    "aiofiles==25.1.*",
]

test = [
    "alembic==1.18.*",
    "psycopg[binary]==3.3.*",
    "pytest==9.0.*",
    "pytest-asyncio==1.3.*",
    "pytest-cov==7.1.*",
    "testcontainers[postgres]==4.14.*",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:^The @wait_container_is_ready decorator:DeprecationWarning"
]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py313"

exclude = [
    "alembic",
]

[tool.ruff.lint]
select = ["S", "I", "E", "F", "B"]
ignore = ["B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
