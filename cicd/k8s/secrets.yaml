apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: prawobiorca-secrets
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/prawobiorca/secrets/postgres-password/versions/latest"
        path: "postgres-password"
  secretObjects:
    - secretName: prawobiorca-secrets
      type: Opaque
      data:
        - objectName: postgres-password
          key: POSTGRES_PASSWORD