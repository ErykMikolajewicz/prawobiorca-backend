apiVersion: v1
kind: Secret
metadata:
  name: prawobiorca-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: "postgres"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        sendfile on;

        upstream backend_upstream {
            server prawobiorca-backend:8000;
        }

        upstream frontend_upstream {
            server prawobiorca-frontend:8000;
        }

        upstream rustfs_upstream {
            server rustfs:9000;
        }

        server {
            listen 8080;

            # Backend API routes
            location /api {
                proxy_pass http://backend_upstream;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Backend Docs routes
            location ~ ^/(docs|openapi.json) {
                proxy_pass http://backend_upstream;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Storage routes
            location /storage/ {
                proxy_pass http://rustfs_upstream/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Frontend routes
            location / {
                proxy_pass http://frontend_upstream;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prawobiorca-backend-config
data:
  APP_LOGGING_LEVEL: "INFO"
  APP_SESSION_ID_EXPIRATION_SECONDS: "500"
  APP_HTTP_CLIENT: "HTTPX"
  APP_DOCUMENT_DESIRED_TOKENS_LENGTH: "300"

  RELATIONAL_DB_DRIVER: "postgresql+asyncpg"
  RELATIONAL_DB_USER: "postgres"
  RELATIONAL_DB_HOST: "postgres"
  RELATIONAL_DB_PORT: "5432"
  RELATIONAL_DB_NAME: "postgres"
  RELATIONAL_DB_POOL_SIZE: "50"
  RELATIONAL_DB_MAX_OVERFLOW: "20"
  RELATIONAL_DB_POOL_TIMEOUT: "30"
  RELATIONAL_DB_POOL_RECYCLE: "5"

  HTTPX_TIMEOUT: "30"
  HTTPX_MAX_CONNECTIONS: "20"
  HTTPX_MAX_KEEP_ALIVE_CONNECTIONS: "5"

  TEXT_TRANSFORMATOR_URL: "http://text-transformator:8080"
  TEXT_TRANSFORMATOR_MAX_TOKENS: "2048"
  TEXT_TRANSFORMATOR_MAX_TITLE_TOKENS_OVERHEAD: "16"

  OBJECT_STORAGE_ENDPOINT_URL: "http://rustfs:9000"
  OBJECT_STORAGE_REGION: "us-east-1"
  OBJECT_STORAGE_ACCESS_KEY: "rustfsadmin"
  OBJECT_STORAGE_SECRET_KEY: "rustfsadmin"
  OBJECT_STORAGE_BUCKET: "regulations"
  OBJECT_STORAGE_SIGNED_URL_EXPIRATION_SECONDS: "3600"
  OBJECT_STORAGE_MAX_FILE_SIZE_BYTES: "10485760"

---
apiVersion: v1
kind: Pod
metadata:
  name: postgres
  labels:
    app: prawobiorca
    component: postgres
spec:
  containers:
    - name: postgres
      image: docker.io/pgvector/pgvector:0.8.4-pg18-trixie
      ports:
        - containerPort: 5432
          hostPort: 5432
      volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_DB
          value: "postgres"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: prawobiorca-secrets
              key: POSTGRES_PASSWORD
  volumes:
    - name: postgres-data
      persistentVolumeClaim:
        claimName: postgres_data_local

---
apiVersion: v1
kind: Pod
metadata:
  name: rustfs
  labels:
    app: prawobiorca
    component: rustfs
spec:
  containers:
    - name: rustfs
      image: docker.io/rustfs/rustfs:latest
      ports:
        - containerPort: 9000
          hostPort: 9000
        - containerPort: 9001
      volumeMounts:
        - name: rustfs-data
          mountPath: /data
  volumes:
    - name: rustfs-data
      persistentVolumeClaim:
        claimName: rustfs_data_local

---
apiVersion: v1
kind: Pod
metadata:
  name: text-transformator
  labels:
    app: prawobiorca
    component: text-transformator
spec:
  containers:
    - name: text-transformator
      image: localhost/text-transformator:latest
      ports:
        - containerPort: 8080
          hostPort: 8081
      env:
        - name: OMP_NUM_THREADS
          value: "2"

---
apiVersion: v1
kind: Pod
metadata:
  name: prawobiorca-backend
  labels:
    app: prawobiorca
    component: prawobiorca-backend
spec:
  containers:
    - name: prawobiorca-backend
      image: localhost/prawobiorca-backend:latest
      ports:
        - containerPort: 8000
      envFrom:
        - configMapRef:
            name: prawobiorca-backend-config
      env:
        - name: RELATIONAL_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: prawobiorca-secrets
              key: POSTGRES_PASSWORD

---
apiVersion: v1
kind: Pod
metadata:
  name: prawobiorca-frontend
  labels:
    app: prawobiorca
    component: prawobiorca-frontend
spec:
  containers:
    - name: prawobiorca-frontend
      image: localhost/prawobiorca-frontend:latest
      ports:
        - containerPort: 8000

---
apiVersion: v1
kind: Pod
metadata:
  name: nginx
  labels:
    app: prawobiorca
    component: nginx
spec:
  containers:
    - name: nginx
      image: docker.io/library/nginx:alpine
      ports:
        - containerPort: 8080
          hostPort: 8080
      volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
  volumes:
    - name: nginx-conf
      configMap:
        name: nginx-config
