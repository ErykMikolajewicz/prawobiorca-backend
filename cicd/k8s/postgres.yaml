apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prawobiorca
      component: postgres
  template:
    metadata:
      labels:
        app: prawobiorca
        component: postgres
    spec:
      serviceAccountName: prawobiorca-runner
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.2-pg18-trixie
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
            - name: pg-data
              mountPath: /var/lib/postgresql
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_DB
              value: "postgres"
            - name: POSTGRES_PASSWORD_FILE
              value: "/mnt/secrets-store/postgres-password"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: prawobiorca-secrets
        - name: pg-data
          persistentVolumeClaim:
            claimName: pg-data

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: prawobiorca
    component: postgres
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi