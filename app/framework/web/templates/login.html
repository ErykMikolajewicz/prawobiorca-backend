{% extends "base.html" %}

{% block title %}Logowanie - PRAWOBIORCA{% endblock %}

{% block content %}
<h2>Logowanie</h2>

{% if error_message %}
  <div role="alert" style="padding: 12px; border: 1px solid #c00; background: #fee; color: #900; margin: 12px 0;">
    <strong>Błąd:</strong> {{ error_message }}
  </div>
{% endif %}

<form action="/auth/login" method="post">
    <div class="mb-3">
        <label for="username" class="form-label">Nazwa użytkownika:</label>
        <input type="text" id="username" class="form-control w-25" name="username" required>
    </div>
    
    <div class="mb-3">
        <label for="password" class="form-label">Hasło:</label>
        <input type="password" class="form-control w-25" id="password" name="password" required>
    </div>

    <button type="submit" class="btn btn-primary">Zaloguj</button>
</form>

<p>
    <a href="/accounts/register">Załóż konto</a>
</p>
{% endblock %}
