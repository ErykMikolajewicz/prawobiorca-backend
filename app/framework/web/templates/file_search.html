<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wyszukiwanie: {{ filename }}</title>
  </head>
  <body>
    <p><a href="/">← Powrót do listy plików</a></p>

    <h1>Przeszukaj plik: {{ filename }}</h1>

    <form method="post">
      <label for="query">Twoje zapytanie:</label>
      <input type="text" id="query" name="query" placeholder="Wpisz treść..." required />
      <button type="submit">Szukaj</button>
    </form>

    {% if results %}
      <hr />
      <h2>Wyniki:</h2>
      <ul>
        {% for result in results %}
          <li>{{ result }}</li>
        {% endfor %}
      </ul>
    {% elif query %}
      <hr />
      <p>Brak wyników dla zapytania: "{{ query }}"</p>
    {% endif %}

  </body>
</html>
