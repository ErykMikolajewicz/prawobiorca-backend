{% macro auth_button(is_user_logged) %}
  <div class="auth-controls">
    {% if is_user_logged %}
      <form action="/api/auth/logout" method="post" style="display: inline;">
        <button type="submit" class="btn btn-primary">Wyloguj się</button>
      </form>
    {% else %}
      <a href="/api/auth/login" style="text-decoration: none;">
        <button type="button" class="btn btn-primary">Zaloguj się</button>
      </a>
    {% endif %}
  </div>
{% endmacro %}


{% macro show_error(message) %}
  {% if message %}
    <div role="alert" style="padding: 12px; border: 1px solid #c00; background: #fee; color: #900; margin: 12px 0;">
      <strong>Błąd:</strong> {{ message }}
    </div>
  {% endif %}
{% endmacro %}


{% macro show_info(message) %}
  {% if message %}
    <div role="status">
      <strong>Info:</strong> {{ message }}
    </div>
  {% endif %}
{% endmacro %}
