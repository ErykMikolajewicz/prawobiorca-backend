[project]
site_name = "Prawobiorca developer documentation"
site_description = "Basic information about the architecture of the Prawobiorca application, its tests, and CI/CD"
site_author = "Eryk Antoni Mikołajewicz"
nav = [
    {"Home" = "index.md"},
    {"Application logic" = "app_logic.md"},
    {"Workflow" = "workflow.md"},
    {"Application architecture" = [
        {"General information" = "architecture/architecture.md"},
        {"Coding Rules" = "architecture/coding_rules.md"},
        {"Library Overview" = "architecture/libraries.md"},
        {"External services" = "architecture/external_services.md"}
    ]},
  {"Tests" = [
    {"General information" = "tests/tests.md"},
    {"Main fixtures" = "tests/main_fixtures.md"},
    {"Integration fixtures" = "tests/integration_fixtures.md"}
  ]}
]

[project.plugins.search]
[project.plugins.mkdocstrings.handlers.python]
paths = ["app", "tests"]


[project.theme.classic]
[project.theme]
variant = "classic"
name = "material"
language = "en"

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
media = "(prefers-color-scheme: light)"

[project.theme.palette.toggle]
icon = "material/weather-night"
name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "blue"
accent = "orange"
media = "(prefers-color-scheme: dark)"

[project.theme.palette.toggle]
icon = "material/weather-sunny"
name = "Switch to light mode"


[project.markdown_extensions.attr_list]